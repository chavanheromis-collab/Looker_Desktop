<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Looker Studio Viewer</title>

<style>
:root {
  --bg:#0f1724; --card:#0b1220; --accent:#06b6d4; --muted:#9aa6bf;
  font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial;
}
html,body{margin:0;height:100%;background:var(--bg);color:#e6eef8}
.app{display:none;flex-direction:column;height:100vh}
header{display:flex;align-items:center;padding:12px;background:#0b1220}
.logo{width:36px;height:36px;border-radius:8px;
background:linear-gradient(135deg,var(--accent),#60a5fa);
display:flex;align-items:center;justify-content:center;color:#051022;font-weight:700}
.spacer{flex:1}
button{background:rgba(255,255,255,.05);border:0;color:#fff;
padding:8px 12px;border-radius:8px;cursor:pointer}
main{flex:1;display:flex;overflow:hidden}
.sidebar{width:230px;background:var(--card);padding:12px;overflow-y:auto}
.sidebar button{width:100%;text-align:left;margin-bottom:6px}
.sidebar button.active{background:var(--accent);color:#051022}
.frame{flex:1}
iframe{width:100%;height:100%;border:0}
.loading{position:fixed;inset:0;display:flex;align-items:center;
justify-content:center;flex-direction:column;gap:12px}
.spinner{width:40px;height:40px;border:4px solid rgba(6,182,212,.3);
border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error{color:#ef4444;text-align:center;padding:20px}
.user{font-size:12px;color:var(--muted);margin:10px}
</style>
</head>

<body>

<div id="loading" class="loading">
  <div class="spinner"></div>
  <div>Verifying access…</div>
</div>

<div class="app" id="app">
<header>
  <div class="logo">LS</div>
  <div style="margin-left:10px">
    <div>Looker Studio</div>
    <div id="roleLabel" style="font-size:12px;color:var(--muted)"></div>
  </div>
  <div class="spacer"></div>
  <button id="openNative">Open</button>
</header>

<main>
  <aside class="sidebar">
    <div class="user" id="userInfo"></div>
    <div id="menu"></div>
  </aside>
  <div class="frame">
    <iframe id="frame"></iframe>
  </div>
</main>
</div>

<script>
/* ================= CONFIG ================= */
const API =
'https://script.google.com/a/macros/chavanhero.in/s/AKfycbw0pC4J3lHdIGODq5iT8rCZ7pLZy0Mg3q3V6LnzyFeKozkp4qL1dlYftGmc98UrWRB3/exec';

const PAGES = {
  1: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/page_12345',
  2: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_8qpzw1t6zd',
  3: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_dfjb22wh0d',
  4: 'PAGE4_URL',
  5: 'PAGE5_URL',
  6: 'PAGE6_URL',
  7: 'PAGE7_URL',
  8: 'PAGE8_URL'
};

/* ================= INIT ================= */
(async function () {
  const params = new URLSearchParams(location.search);
  const email = params.get('email');

  if (!email) return deny('Email missing');

  const res = await fetch(`${API}?email=${encodeURIComponent(email)}&src=appsheet`);
  const data = await res.json();

  if (!data.authorized) return deny(data.error || 'Access denied');

  boot(data);
})();

/* ================= FUNCTIONS ================= */
function boot(user) {
  document.getElementById('loading').remove();
  document.getElementById('app').style.display = 'flex';

  document.getElementById('userInfo').textContent = user.email;
  document.getElementById('roleLabel').textContent = user.role;

  const menu = document.getElementById('menu');
  const frame = document.getElementById('frame');

  user.pages.forEach((p, i) => {
    const btn = document.createElement('button');
    btn.textContent = `Page ${p}`;
    btn.onclick = () => load(PAGES[p], btn);
    if (i === 0) btn.classList.add('active');
    menu.appendChild(btn);
    if (i === 0) frame.src = PAGES[p];
  });

  document.getElementById('openNative').onclick = () => {
    const url = frame.src.replace('/embed/reporting', '/reporting');
    window.open(url, '_blank');
  };
}

function load(url, btn) {
  if (!url.startsWith('https://lookerstudio.google.com/embed/')) return;
  document.querySelectorAll('.sidebar button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('frame').src = url;
}

function deny(msg) {
  document.getElementById('loading').innerHTML =
    `<div class="error"><h3>Access Denied</h3><p>${msg}</p></div>`;
}
</script>
</body>
</html>
