<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CHAVAN HERO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#1a1d29;
  --panel:#252936;
  --accent:#667eea;
  --text:#fff;
  --muted:#b8c1ec;
  font-family:Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text)}
.app{display:none;height:100vh;flex-direction:column}
header{display:flex;align-items:center;padding:12px 16px;background:linear-gradient(135deg,#667eea,#764ba2)}
.logo{width:36px;height:36px;background:rgba(255,255,255,.25);border-radius:10px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.title{margin-left:12px;font-size:16px;font-weight:600}
.spacer{flex:1}
.header-btn{margin-left:8px;padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.15);color:#fff;cursor:pointer;font-size:13px}
.header-btn:hover{background:rgba(255,255,255,.25)}
main{flex:1;display:flex;overflow:hidden}
.sidebar{width:240px;background:var(--panel);border-right:1px solid rgba(255,255,255,.08);padding:12px}
.menu button{width:100%;margin-bottom:6px;padding:10px 12px;border-radius:8px;background:none;border:none;color:var(--muted);text-align:left;cursor:pointer}
.menu button.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.viewer{flex:1;padding:12px}
.iframe-wrap{width:100%;height:100%;background:#fff;border-radius:12px;overflow:hidden}
iframe{width:100%;height:100%;border:0}
#loading{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--muted);z-index:100}
</style>
</head>

<body>

<div id="loading">Checking access…</div>

<div class="app" id="app">
<header>
  <div class="logo">
    <img src="https://raw.githubusercontent.com/chavanheromis-collab/Looker_Desktop/main/c.png">
  </div>
  <div class="title">CHAVAN HERO</div>
  <div class="spacer"></div>
  <button class="header-btn" id="refreshBtn">Refresh</button>
  <button class="header-btn" id="openBtn">Open ↗</button>
</header>

<main>
  <aside class="sidebar">
    <div class="menu" id="menu"></div>
  </aside>

  <div class="viewer">
    <div class="iframe-wrap">
      <iframe id="frame"></iframe>
    </div>
  </div>
</main>
</div>

<script>
'use strict';

/* ================= CONFIG ================= */

const API = "PASTE_YOUR_WEBAPP_URL_HERE";

const PAGES = {
  1:'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/page_12345',
  2:'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_7o5hbob7zd',
  3:'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_7tfj2zvo0d',
  4:'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_dfjb22wh0d',
  5:'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_n8om9d8j0d',
  6:'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_yrgbw0z6zd',
  7:'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_w5jne27j0d'
};

const PAGE_NAMES = {
  1:'Overview',
  2:'FLOW CHART',
  3:'FIFO Stock',
  4:'PDI Stock',
  5:'Enquiry Report',
  6:'Follow-Up Report',
  7:'Network Stock'
};

let currentDSE = "";
let currentRole = "";

/* ================= INIT ================= */

(async()=>{
  const params = new URLSearchParams(location.search);
  const code = params.get('code');

  if(!code) return showError('Missing access code');

  try{
    const res = await fetch(`${API}?code=${encodeURIComponent(code)}`);
    const data = await res.json();

    if(!data.authorized)
      return showError('Invalid or disabled access');

    initApp(data.pages, data.dse, data.role);

  }catch(err){
    showError('Connection error');
  }
})();

/* ================= APP ================= */

function initApp(pages, dse, role){

  currentDSE = dse;
  currentRole = role;

  document.getElementById('loading').remove();
  document.getElementById('app').style.display='flex';

  const menu=document.getElementById('menu');
  const frame=document.getElementById('frame');
  let activeBtn=null;

  document.querySelector('.title').innerHTML += ` - ${dse}`;

  pages.forEach((p,i)=>{
    const btn=document.createElement('button');
    btn.textContent=PAGE_NAMES[p];

    btn.onclick=()=>{
      if(activeBtn)activeBtn.classList.remove('active');
      btn.classList.add('active');
      activeBtn=btn;

      let url = PAGES[p];

      if(currentRole === "DSE"){
        const filter = encodeURIComponent(
          JSON.stringify({ df_dse: currentDSE })
        );
        url += "?params=" + filter;
      }

      frame.src = url;
    };

    menu.appendChild(btn);
    if(i===0)btn.click();
  });

  document.getElementById('refreshBtn').onclick=()=>{
    frame.src = frame.src.split('&_ts=')[0] + '&_ts=' + Date.now();
  };

  document.getElementById('openBtn').onclick=()=>{
    if(frame.src)
      window.open(frame.src.replace('/embed/reporting','/reporting').split('&_ts=')[0],'_blank');
  };
}

/* ================= ERROR ================= */

function showError(msg){
  document.getElementById('loading').textContent=msg;
}
</script>

</body>
</html>
