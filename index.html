<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Looker Studio — Mobile Viewer</title>
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#00bcd4">

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Looker Studio">
  <link rel="apple-touch-icon" href="./apple-touch-icon.png">

  <style>
    :root {
      --bg: #0f1724;
      --card: #0b1220;
      --muted: #9aa6bf;
      --accent: #06b6d4;
      --glass: rgba(255, 255, 255, 0.05);
      font-family: Inter, system-ui, -apple-system, 'Segoe UI', Roboto, Arial;
    }

    html, body {
      margin: 0;
      height: 100%;
      background: linear-gradient(180deg, var(--bg), #071029);
      color: #e6eef8;
    }

    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      max-width: 100%;
      overflow: hidden;
    }

    header.toolbar {
      display: flex;
      align-items: center;
      padding: 12px;
      gap: 10px;
      background: linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.01));
      backdrop-filter: blur(6px);
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
      z-index: 10;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent), #60a5fa);
      border-radius: 10px;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #051022;
    }

    .title { font-weight: 600; font-size: 14px; }
    .subtitle { font-size: 12px; color: var(--muted); }

    .spacer { flex: 1; }

    .btn, .icon-btn {
      background: var(--glass);
      border: 0;
      color: #e6eef8;
      padding: 8px 12px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    .icon-btn {
      background: transparent;
      border: 1px solid rgba(255,255,255,0.1);
      padding: 8px 10px;
    }

    main.viewer {
      flex: 1;
      display: flex;
      position: relative;
      overflow: hidden;
    }

    /* SIDEBAR STYLES */
    .sidebar {
      width: 240px;
      background: var(--card);
      border-right: 1px solid rgba(255,255,255,0.05);
      box-shadow: 4px 0 20px rgba(0,0,0,0.5);
      padding: 16px 12px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      transform: translateX(0);
      transition: transform 0.3s ease;
      z-index: 9;
    }

    .sidebar.hidden {
      transform: translateX(-260px);
    }

    .sidebar h3 {
      margin: 0 0 10px 8px;
      color: var(--muted);
      font-size: 13px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }

    .sidebar button {
      background: transparent;
      border: none;
      text-align: left;
      padding: 10px 12px;
      border-radius: 8px;
      color: #e6eef8;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .sidebar button:hover {
      background: rgba(255,255,255,0.05);
      color: var(--accent);
    }

    .sidebar button.active {
      background: var(--accent);
      color: #051022;
      font-weight: 600;
    }

    /* Overlay when sidebar open (for mobile) */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(3px);
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease;
      z-index: 8;
    }

    .overlay.show {
      opacity: 1;
      visibility: visible;
    }

    /* Iframe container */
    .frame-wrap {
      flex: 1;
      border-radius: 0;
      overflow: hidden;
      background: linear-gradient(180deg,#051022, #071029);
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }

    iframe.report {
      width: 100%;
      height: 100%;
      border: 0;
    }

    .toggle-sidebar {
      display: inline-flex;
    }

    @media (min-width: 768px) {
      .sidebar {
        position: relative;
        transform: translateX(0) !important;
      }
      .overlay { display: none !important; }
    }

  </style>
</head>

<body>
  <div class="app" role="application">
    <header class="toolbar">
      <button id="toggleSidebar" class="icon-btn toggle-sidebar">☰</button>
      <div class="brand">
        <div class="logo">LS</div>
        <div>
          <div class="title">Looker Studio Viewer</div>
          <div class="subtitle">Mobile-optimized wrapper</div>
        </div>
      </div>
      <div class="spacer"></div>
      <button id="open-native" class="btn">Open</button>
      <button id="fullscreen" class="icon-btn">⛶</button>
    </header>

    <main class="viewer">
      <aside id="sidebar" class="sidebar">
        <h3>Reports</h3>
        <button data-url="https://lookerstudio.google.com/embed/reporting/103aa740-f3fa-458e-b496-a6861c15c88c/page/p_qpwrvqb8ud" class="active">EBRD Report</button>
        <button data-url="https://lookerstudio.google.com/embed/reporting/55506476-0bed-467d-9bcc-66c3b305b809/page/mn2aF">Sales Report</button>
        <button data-url="https://lookerstudio.google.com/embed/reporting/103aa740-f3fa-458e-b496-a6861c15c88c/page/p_qpwrvqb8ud">Finance Overview</button>
      </aside>

      <div class="overlay" id="overlay"></div>

      <div id="frameWrap" class="frame-wrap">
        <iframe id="reportFrame" class="report" src="" allowfullscreen loading="lazy"></iframe>
      </div>
    </main>
  </div>

  <script>
    const sidebar = document.getElementById('sidebar');
    const toggleSidebar = document.getElementById('toggleSidebar');
    const overlay = document.getElementById('overlay');
    const reportFrame = document.getElementById('reportFrame');
    const openNative = document.getElementById('open-native');
    const fullscreenBtn = document.getElementById('fullscreen');

    // Sidebar toggle for mobile
    toggleSidebar.addEventListener('click', () => {
      sidebar.classList.toggle('hidden');
      overlay.classList.toggle('show');
    });
    overlay.addEventListener('click', () => {
      sidebar.classList.add('hidden');
      overlay.classList.remove('show');
    });

    // Load selected report
    function loadReport(url) {
      if (!url) return;
      reportFrame.src = url;
      localStorage.setItem('lastReport', url);
    }

    // Handle sidebar clicks
    sidebar.querySelectorAll('button[data-url]').forEach(btn => {
      btn.addEventListener('click', () => {
        sidebar.querySelectorAll('button').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        loadReport(btn.dataset.url);
        sidebar.classList.add('hidden');
        overlay.classList.remove('show');
      });
    });

    // Restore last report or default
    const saved = localStorage.getItem('lastReport');
    if (saved) {
      const match = [...sidebar.querySelectorAll('button')].find(b => b.dataset.url === saved);
      if (match) match.classList.add('active');
      loadReport(saved);
    } else {
      const first = sidebar.querySelector('button[data-url]');
      loadReport(first.dataset.url);
    }

    // Open native Looker Studio tab
    openNative.addEventListener('click', () => {
      const active = sidebar.querySelector('button.active');
      if (active) window.open(active.dataset.url.replace('/embed/reporting','/reporting'), '_blank');
    });

    // Fullscreen toggle
    fullscreenBtn.addEventListener('click', async () => {
      const el = reportFrame;
      if (!document.fullscreenElement) await el.requestFullscreen();
      else document.exitFullscreen();
    });

    // Register service worker
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('./service-worker.js')
        .then(() => console.log('Service Worker registered'))
        .catch(err => console.warn('SW failed', err));
    }
  </script>
</body>
</html>
