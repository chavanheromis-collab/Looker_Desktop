<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CHAVAN HERO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#1a1d29;
  --panel:#252936;
  --accent:#667eea;
  --text:#fff;
  --muted:#b8c1ec;
  font-family:Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text)}

.hidden{display:none}

/* LOGIN */
.login{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.login-box{
  background:var(--panel);
  padding:40px;
  border-radius:16px;
  width:350px;
  text-align:center;
}
.login-box h2{margin-bottom:20px}
.login-box input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:none;
  margin-bottom:16px;
}
.login-box button{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:none;
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:#fff;
  cursor:pointer;
}
.error{
  color:#ff6b6b;
  margin-top:10px;
  font-size:14px;
}

/* DASHBOARD */
.app{display:none;height:100vh;flex-direction:column}
header{display:flex;align-items:center;padding:12px 16px;background:linear-gradient(135deg,#667eea,#764ba2)}
.logo{width:36px;height:36px;background:rgba(255,255,255,.25);border-radius:10px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.title{margin-left:12px;font-size:16px;font-weight:600}
.spacer{flex:1}
.header-btn{margin-left:8px;padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.15);color:#fff;cursor:pointer;font-size:13px}
main{flex:1;display:flex;overflow:hidden}
.sidebar{width:240px;background:var(--panel);padding:12px}
.menu button{width:100%;margin-bottom:6px;padding:10px;border:none;border-radius:8px;background:none;color:var(--muted);text-align:left;cursor:pointer}
.menu button.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.viewer{flex:1;padding:12px}
.iframe-wrap{width:100%;height:100%;background:#fff;border-radius:12px;overflow:hidden}
iframe{width:100%;height:100%;border:0}
</style>
</head>

<body>

<!-- LOGIN PAGE -->
<div class="login" id="loginPage">
  <div class="login-box">
    <h2>CHAVAN HERO</h2>
    <input type="password" id="accessCode" placeholder="Enter Access Code">
    <button id="loginBtn">Login</button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<!-- DASHBOARD -->
<div class="app" id="app">
<header>
  <div class="logo">
    <img src="https://raw.githubusercontent.com/chavanheromis-collab/Looker_Desktop/main/c.png">
  </div>
  <div class="title">CHAVAN HERO</div>
  <div class="spacer"></div>
  <button class="header-btn" id="logoutBtn">Logout</button>
</header>

<main>
  <aside class="sidebar">
    <div class="menu" id="menu"></div>
  </aside>
  <div class="viewer">
    <div class="iframe-wrap">
      <iframe id="frame"></iframe>
    </div>
  </div>
</main>
</div>

<script>
'use strict';

const API = "https://script.google.com/macros/s/AKfycbznU_3SWKemZRGHLaf0Yunuk1WHQYS-ncthLPNGg3thBhkyDbLijl0IYnY2RAmvVado/exec";

const PAGES = {
  1:'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_7o5hbob7zd',
  2:'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/page_12345',
  3:'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_m59n1wrr0d',
  4:'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_tnkmoexp0d',
  5:'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_yrgbw0z6zd',
  6:'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_7tfj2zvo0d',
  7:'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_dfjb22wh0d',
  8:'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_w5jne27j0d'
};

const PAGE_NAMES = {
  1:'FLOW CHART',
  2:'B2D OVERVIEW',
  3:'Quotation Report',
  4:'Enquiry Report',
  5:'Follow-Up Report',
  6:'FIFO STOCK',
  7:'PDI STOCK',
  8:'NETWORK STOCK'
};

let currentDSE = "";
let currentRole = "";

/* LOGIN */

document.getElementById('loginBtn').onclick = async () => {

  const code = document.getElementById('accessCode').value.trim();
  const errorBox = document.getElementById('loginError');

  if(!code){
    errorBox.textContent = "Please enter access code";
    return;
  }

  try{
    const res = await fetch(`${API}?code=${encodeURIComponent(code)}`);
    const data = await res.json();

    if(!data.authorized){
      errorBox.textContent = "Invalid or disabled access";
      return;
    }

    currentDSE = data.dse;
    currentRole = data.role;

    document.getElementById('loginPage').style.display = "none";
    document.getElementById('app').style.display = "flex";

    initDashboard();

  }catch(err){
    errorBox.textContent = "Server error";
  }
};

/* DASHBOARD */

function initDashboard(){

  document.querySelector('.title').innerHTML += ` - ${currentDSE}`;

  const menu = document.getElementById('menu');
  const frame = document.getElementById('frame');
  let activeBtn = null;

  let allowedPages;

  if(currentRole === "Admin"){
    allowedPages = Object.keys(PAGES);
  } else {
    allowedPages = [2,3,4,5];
  }

  allowedPages.forEach((p,i)=>{

    const btn=document.createElement('button');
    btn.textContent=PAGE_NAMES[p];

    btn.onclick=()=>{

      if(activeBtn)activeBtn.classList.remove('active');
      btn.classList.add('active');
      activeBtn=btn;

      let url = PAGES[p];

      if(currentRole === "DSE"){

        const filterValue = `include\uE0000\uE0000IN\uE0000${currentDSE}`;
        const params = encodeURIComponent(JSON.stringify({ df4: filterValue }));
        url += "?params=" + params;
      }

      frame.src = url;
    };

    menu.appendChild(btn);

    if(i===0)btn.click();
  });
}

/* LOGOUT */

document.getElementById('logoutBtn').onclick = () => {
  location.reload();
};
</script>

</body>
</html>
