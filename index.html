<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Looker Studio Viewer</title>
<link rel="dns-prefetch" href="https://lookerstudio.google.com">
<link rel="preconnect" href="https://lookerstudio.google.com">
<link rel="preconnect" href="https://script.google.com">

<style>
:root{--bg:#0f1724;--card:#0b1220;--accent:#06b6d4;--muted:#9aa6bf;
font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:#e6eef8;overflow:hidden}
.app{display:none;flex-direction:column;height:100vh}
header{display:flex;align-items:center;padding:10px 12px;background:#0b1220;
border-bottom:1px solid rgba(255,255,255,.05)}
.logo{width:32px;height:32px;border-radius:6px;
background:linear-gradient(135deg,var(--accent),#60a5fa);
display:flex;align-items:center;justify-content:center;color:#051022;font-weight:700;font-size:14px}
.title{margin-left:8px;font-size:14px;font-weight:600}
.role{font-size:11px;color:var(--muted);margin-top:2px}
.spacer{flex:1}
button{background:rgba(255,255,255,.05);border:0;color:#fff;
padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;transition:background .15s}
button:hover{background:rgba(255,255,255,.1)}
button:active{transform:scale(.98)}
main{flex:1;display:flex;overflow:hidden}
.sidebar{width:200px;background:var(--card);padding:8px;overflow-y:auto;
border-right:1px solid rgba(255,255,255,.05)}
.user{font-size:11px;color:var(--muted);padding:8px;margin-bottom:8px;
border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar button{width:100%;text-align:left;margin-bottom:4px;padding:8px 10px;font-size:13px}
.sidebar button.active{background:var(--accent);color:#051022;font-weight:600}
.frame{flex:1;position:relative;background:#000}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.loading{position:fixed;inset:0;display:flex;align-items:center;
justify-content:center;flex-direction:column;gap:12px;background:var(--bg);z-index:9999}
.spinner{width:36px;height:36px;border:3px solid rgba(6,182,212,.2);
border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error{color:#ef4444;text-align:center;padding:20px;max-width:500px}
.error h3{margin:0 0 8px;font-size:18px}
.error p{margin:4px 0;font-size:13px;opacity:.8}
@media(max-width:768px){
.sidebar{width:100%;max-width:240px;position:absolute;left:0;top:0;bottom:0;
transform:translateX(-100%);transition:transform .2s;z-index:10}
.sidebar.open{transform:translateX(0)}
.toggle{display:block!important}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9}
.overlay.show{display:block}
}
.toggle{display:none;margin-right:8px}
</style>
</head>

<body>

<div id="loading" class="loading">
  <div class="spinner"></div>
  <div style="font-size:13px;opacity:.7">Verifying...</div>
</div>

<div class="app" id="app">
<header>
  <button class="toggle" id="toggle">☰</button>
  <div class="logo">LS</div>
  <div style="margin-left:8px">
    <div class="title">Looker Studio</div>
    <div class="role" id="roleLabel"></div>
  </div>
  <div class="spacer"></div>
  <button id="open">Open ↗</button>
</header>

<main>
  <div class="overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="user" id="userInfo"></div>
    <div id="menu"></div>
  </aside>
  <div class="frame">
    <iframe id="frame" loading="lazy"></iframe>
  </div>
</main>
</div>

<script>
'use strict';

// ============ CONFIG ============
const API = 'https://script.google.com/a/macros/chavanhero.in/s/AKfycbw0pC4J3lHdIGODq5iT8rCZ7pLZy0Mg3q3V6LnzyFeKozkp4qL1dlYftGmc98UrWRB3/exec';

// REPLACE WITH YOUR ACTUAL LOOKER STUDIO PAGE URLs
const PAGES = {
  1: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_qpwrvqb8ud',
  2: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_8qpzw1t6zd',
  3: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_dfjb22wh0d',
  4: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_abc456',
  5: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_def789',
  6: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_ghi012',
  7: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_jkl345',
  8: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_mno678'
};

const PAGE_NAMES = {
  1: 'Dashboard',
  2: 'Sales Report',
  3: 'Performance',
  4: 'Inventory',
  5: 'Call Analytics',
  6: 'Financial',
  7: 'Customer Data',
  8: 'Admin Panel'
};

// ============ INIT ============
(async () => {
  const params = new URLSearchParams(location.search);
  const email = params.get('email');
  
  if (!email) return deny('Email parameter missing from URL');

  try {
    // Always send src=appsheet to API
    const url = `${API}?email=${encodeURIComponent(email)}&src=appsheet`;
    console.log('Fetching:', url);
    
    const res = await fetch(url);
    const text = await res.text();
    console.log('Raw response:', text);
    
    const data = JSON.parse(text);
    console.log('Parsed data:', data);
    
    if (!data.authorized) {
      throw new Error(data.error || 'Access denied');
    }
    
    if (!data.pages || data.pages.length === 0) {
      throw new Error('No pages available for your role');
    }
    
    boot(data);
    
  } catch (err) {
    console.error('Error:', err);
    deny(err.message);
  }
})();

// ============ BOOT ============
function boot(user) {
  const loading = document.getElementById('loading');
  const app = document.getElementById('app');
  const userInfo = document.getElementById('userInfo');
  const roleLabel = document.getElementById('roleLabel');
  const menu = document.getElementById('menu');
  const frame = document.getElementById('frame');
  const openBtn = document.getElementById('open');
  const toggle = document.getElementById('toggle');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');

  // Remove loading
  loading.remove();
  app.style.display = 'flex';

  // Set user info
  userInfo.textContent = user.email;
  roleLabel.textContent = user.role;

  // Create buttons
  let firstUrl = null;
  let activeBtn = null;

  user.pages.forEach((pageNum, idx) => {
    const url = PAGES[pageNum];
    if (!url) return;
    
    const btn = document.createElement('button');
    btn.textContent = PAGE_NAMES[pageNum] || `Page ${pageNum}`;
    btn.onclick = () => {
      if (activeBtn) activeBtn.classList.remove('active');
      btn.classList.add('active');
      activeBtn = btn;
      frame.src = url;
      
      // Close mobile sidebar
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    };
    
    if (idx === 0) {
      btn.classList.add('active');
      activeBtn = btn;
      firstUrl = url;
    }
    
    menu.appendChild(btn);
  });

  // Load first page after slight delay
  if (firstUrl) {
    setTimeout(() => frame.src = firstUrl, 150);
  }

  // Open native Looker Studio
  openBtn.onclick = () => {
    const currentUrl = frame.src;
    if (currentUrl) {
      const nativeUrl = currentUrl.replace('/embed/reporting', '/reporting');
      window.open(nativeUrl, '_blank', 'noopener,noreferrer');
    }
  };

  // Mobile sidebar toggle
  if (toggle && overlay) {
    toggle.onclick = () => {
      sidebar.classList.add('open');
      overlay.classList.add('show');
    };

    overlay.onclick = () => {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    };
  }

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && sidebar.classList.contains('open')) {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    }
  });
}

// ============ ERROR ============
function deny(msg) {
  const loading = document.getElementById('loading');
  loading.innerHTML = `
    <div class="error">
      <h3>⚠️ Access Denied</h3>
      <p>${msg}</p>
      <p style="margin-top:16px;font-size:12px;opacity:.6">
        Make sure you're using the correct link with your email.
      </p>
    </div>
  `;
}
</script>
</body>
</html>
