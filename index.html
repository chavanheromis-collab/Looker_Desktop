<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Looker Studio Viewer</title>

<style>
:root{--bg:#0f1724;--card:#0b1220;--accent:#06b6d4;--muted:#9aa6bf;
font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:#e6eef8;overflow:hidden}
.app{display:none;flex-direction:column;height:100vh}
header{display:flex;align-items:center;padding:10px 12px;background:#0b1220;
border-bottom:1px solid rgba(255,255,255,.05)}
.logo{width:32px;height:32px;border-radius:6px;
background:linear-gradient(135deg,var(--accent),#60a5fa);
display:flex;align-items:center;justify-content:center;color:#051022;font-weight:700;font-size:14px}
.spacer{flex:1}
button{background:rgba(255,255,255,.05);border:0;color:#fff;
padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;transition:background .15s}
button:hover{background:rgba(255,255,255,.1)}
main{flex:1;display:flex;overflow:hidden}
.sidebar{width:200px;background:var(--card);padding:8px;overflow-y:auto;
border-right:1px solid rgba(255,255,255,.05)}
.user{font-size:11px;color:var(--muted);padding:8px;margin-bottom:8px;
border-bottom:1px solid rgba(255,255,255,.05)}
.sidebar button{width:100%;text-align:left;margin-bottom:4px;padding:8px 10px;font-size:13px}
.sidebar button.active{background:var(--accent);color:#051022;font-weight:600}
.frame{flex:1;background:#000}
iframe{width:100%;height:100%;border:0}
.loading{position:fixed;inset:0;display:flex;align-items:center;
justify-content:center;flex-direction:column;gap:12px;background:var(--bg);z-index:9999}
.spinner{width:36px;height:36px;border:3px solid rgba(6,182,212,.2);
border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error{color:#ef4444;text-align:center;padding:20px;max-width:500px}
.error h3{margin:0 0 8px}
.error p{margin:4px 0;font-size:13px;opacity:.8}
.code{margin-top:12px;padding:10px;background:rgba(0,0,0,.3);border-radius:4px;
font-family:monospace;font-size:10px;max-width:90%;word-break:break-all}
</style>
</head>

<body>

<div id="loading" class="loading">
  <div class="spinner"></div>
  <div style="font-size:13px;opacity:.7">Verifying access...</div>
</div>

<div class="app" id="app">
<header>
  <div class="logo">LS</div>
  <div style="margin-left:8px">
    <div style="font-size:14px;font-weight:600">Looker Studio</div>
    <div id="roleLabel" style="font-size:11px;color:var(--muted)"></div>
  </div>
  <div class="spacer"></div>
  <button id="open">Open ↗</button>
</header>

<main>
  <aside class="sidebar">
    <div class="user" id="userInfo"></div>
    <div id="menu"></div>
  </aside>
  <div class="frame">
    <iframe id="frame"></iframe>
  </div>
</main>
</div>

<script>
'use strict';

// ⚠️ REPLACE THIS WITH YOUR NEW DEPLOYMENT URL (should NOT contain /a/macros/)
// Correct format: https://script.google.com/macros/s/AKfycby.../exec
const API = 'https://script.google.com/macros/s/AKfycbwBXE8QpvlJBOWhAIZiAMJu3dk2j_x2KYLUphppNgs8xJnpDH6OMWRwWZC2aFrCr5FE/exec';

// Replace with your actual Looker Studio page URLs
const PAGES = {
  1: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_qpwrvqb8ud',
  2: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_8qpzw1t6zd',
  3: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_dfjb22wh0d',
  4: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_page4',
  5: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_page5',
  6: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_page6',
  7: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_page7',
  8: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_page8'
};

const NAMES = {
  1: 'Dashboard', 2: 'Sales', 3: 'Performance', 4: 'Inventory',
  5: 'Calls', 6: 'Finance', 7: 'Customers', 8: 'Admin'
};

// ============ INIT ============
(async () => {
  const params = new URLSearchParams(location.search);
  const email = params.get('email');
  
  if (!email) return deny('Missing email parameter', 'Add ?email=yourname@example.com');

  const apiUrl = `${API}?email=${encodeURIComponent(email)}&src=appsheet`;
  
  console.log('🔍 API URL:', apiUrl);

  try {
    const res = await fetch(apiUrl);
    
    console.log('📡 Status:', res.status);
    
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    
    const text = await res.text();
    console.log('📄 Response:', text);
    
    const data = JSON.parse(text);
    console.log('✅ Data:', data);
    
    if (!data.authorized) throw new Error(data.error || 'Access denied');
    if (!data.pages?.length) throw new Error('No pages available');
    
    boot(data);
    
  } catch (err) {
    console.error('❌ Error:', err);
    deny(err.message, err.stack, apiUrl);
  }
})();

// ============ BOOT ============
function boot(user) {
  document.getElementById('loading').remove();
  document.getElementById('app').style.display = 'flex';
  
  document.getElementById('userInfo').textContent = user.email;
  document.getElementById('roleLabel').textContent = user.role;
  
  const menu = document.getElementById('menu');
  const frame = document.getElementById('frame');
  let active = null;
  let firstUrl = null;
  
  user.pages.forEach((p, i) => {
    const url = PAGES[p];
    if (!url) return;
    
    const btn = document.createElement('button');
    btn.textContent = NAMES[p] || `Page ${p}`;
    btn.onclick = () => {
      if (active) active.classList.remove('active');
      btn.classList.add('active');
      active = btn;
      frame.src = url;
    };
    
    if (i === 0) {
      btn.classList.add('active');
      active = btn;
      firstUrl = url;
    }
    
    menu.appendChild(btn);
  });
  
  if (firstUrl) setTimeout(() => frame.src = firstUrl, 100);
  
  document.getElementById('open').onclick = () => {
    if (frame.src) window.open(frame.src.replace('/embed/reporting', '/reporting'), '_blank');
  };
}

// ============ ERROR ============
function deny(msg, detail = '', url = '') {
  document.getElementById('loading').innerHTML = `
    <div class="error">
      <h3>⚠️ ${msg}</h3>
      ${detail ? `<p>${detail}</p>` : ''}
      ${url ? `<div class="code">${url}</div>` : ''}
      <p style="margin-top:20px;font-size:11px;opacity:.5">
        Press F12 to see console logs
      </p>
    </div>
  `;
}
</script>
</body>
</html>
