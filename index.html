<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Looker Studio Viewer</title>
<link rel="dns-prefetch" href="https://lookerstudio.google.com">
<link rel="preconnect" href="https://lookerstudio.google.com">
<link rel="preconnect" href="https://script.google.com">

<style>
:root{--bg:#0f1724;--card:#0b1220;--accent:#06b6d4;--muted:#9aa6bf;
font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:#e6eef8;overflow:hidden}
.app{display:none;flex-direction:column;height:100vh;will-change:transform}
header{display:flex;align-items:center;padding:10px 12px;background:#0b1220;
border-bottom:1px solid rgba(255,255,255,.05)}
.logo{width:32px;height:32px;border-radius:6px;
background:linear-gradient(135deg,var(--accent),#60a5fa);
display:flex;align-items:center;justify-content:center;color:#051022;font-weight:700;font-size:14px}
.title{margin-left:8px;font-size:14px;font-weight:600}
.role{font-size:11px;color:var(--muted);margin-top:2px}
.spacer{flex:1}
button{background:rgba(255,255,255,.05);border:0;color:#fff;
padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px;transition:background .15s}
button:hover{background:rgba(255,255,255,.1)}
button:active{transform:scale(.98)}
main{flex:1;display:flex;overflow:hidden}
.sidebar{width:200px;background:var(--card);padding:8px;overflow-y:auto;
border-right:1px solid rgba(255,255,255,.05);scrollbar-width:thin}
.sidebar::-webkit-scrollbar{width:6px}
.sidebar::-webkit-scrollbar-track{background:transparent}
.sidebar::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
.user{font-size:11px;color:var(--muted);padding:8px;margin-bottom:8px;
border-bottom:1px solid rgba(255,255,255,.05);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sidebar button{width:100%;text-align:left;margin-bottom:4px;padding:8px 10px;font-size:13px}
.sidebar button.active{background:var(--accent);color:#051022;font-weight:600}
.frame{flex:1;position:relative;background:#000}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.loading{position:fixed;inset:0;display:flex;align-items:center;
justify-content:center;flex-direction:column;gap:12px;background:var(--bg);z-index:9999}
.spinner{width:36px;height:36px;border:3px solid rgba(6,182,212,.2);
border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.error{color:#ef4444;text-align:center;padding:20px;max-width:400px}
.error h3{margin:0 0 8px;font-size:18px}
.error p{margin:0;font-size:14px;opacity:.8}
@media(max-width:768px){
.sidebar{width:100%;max-width:240px;position:absolute;left:0;top:0;bottom:0;
transform:translateX(-100%);transition:transform .2s;z-index:10}
.sidebar.open{transform:translateX(0)}
.toggle{display:block!important}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9}
.overlay.show{display:block}
}
.toggle{display:none;margin-right:8px}
</style>
</head>

<body>

<div id="loading" class="loading">
  <div class="spinner"></div>
  <div style="font-size:13px;opacity:.7">Verifying...</div>
</div>

<div class="app" id="app">
<header>
  <button class="toggle" id="toggle">☰</button>
  <div class="logo">LS</div>
  <div style="margin-left:8px">
    <div class="title">Looker Studio</div>
    <div class="role" id="roleLabel"></div>
  </div>
  <div class="spacer"></div>
  <button id="open">Open ↗</button>
</header>

<main>
  <div class="overlay" id="overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div class="user" id="userInfo"></div>
    <div id="menu"></div>
  </aside>
  <div class="frame">
    <iframe id="frame" loading="lazy" importance="high"></iframe>
  </div>
</main>
</div>

<script>
'use strict';

// ============ CONFIG ============
const API = 'https://script.google.com/a/macros/chavanhero.in/s/AKfycbw0pC4J3lHdIGODq5iT8rCZ7pLZy0Mg3q3V6LnzyFeKozkp4qL1dlYftGmc98UrWRB3/exec';
const CACHE_KEY = 'ls_user_cache';
const CACHE_TTL = 3600000; // 1 hour

const PAGES = {
  1: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_page1',
  2: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_page2',
  3: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_page3',
  4: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_page4',
  5: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_page5',
  6: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_page6',
  7: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_page7',
  8: 'https://lookerstudio.google.com/embed/reporting/fe1114cd-13d3-471d-9822-a13e596a738e/page/p_page8'
};

const PAGE_NAMES = {
  1: 'Dashboard',
  2: 'Sales',
  3: 'Performance',
  4: 'Inventory',
  5: 'Calls',
  6: 'Finance',
  7: 'Customers',
  8: 'Admin'
};

// ============ CACHE ============
const cache = {
  get(email) {
    try {
      const data = localStorage.getItem(CACHE_KEY);
      if (!data) return null;
      const parsed = JSON.parse(data);
      if (parsed.email !== email || Date.now() - parsed.ts > CACHE_TTL) {
        this.clear();
        return null;
      }
      return parsed.user;
    } catch { return null; }
  },
  set(email, user) {
    try {
      localStorage.setItem(CACHE_KEY, JSON.stringify({ email, user, ts: Date.now() }));
    } catch {}
  },
  clear() {
    try { localStorage.removeItem(CACHE_KEY); } catch {}
  }
};

// ============ INIT ============
(async () => {
  const params = new URLSearchParams(location.search);
  const email = params.get('email');
  
  if (!email) return deny('Email parameter missing');

  // Try cache first
  let user = cache.get(email);
  
  if (!user) {
    try {
      const res = await fetch(`${API}?email=${encodeURIComponent(email)}&src=appsheet`, {
        method: 'GET',
        headers: { 'Accept': 'application/json' }
      });
      
      if (!res.ok) throw new Error('Network error');
      
      const data = await res.json();
      if (!data.authorized) throw new Error(data.error || 'Access denied');
      
      user = data;
      cache.set(email, user);
    } catch (err) {
      return deny(err.message);
    }
  }

  boot(user);
})();

// ============ BOOT ============
function boot(user) {
  const loading = document.getElementById('loading');
  const app = document.getElementById('app');
  const userInfo = document.getElementById('userInfo');
  const roleLabel = document.getElementById('roleLabel');
  const menu = document.getElementById('menu');
  const frame = document.getElementById('frame');
  const openBtn = document.getElementById('open');
  const toggle = document.getElementById('toggle');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');

  // Remove loading
  loading.remove();
  app.style.display = 'flex';

  // Set user info
  userInfo.textContent = user.email;
  roleLabel.textContent = user.role;

  // Create buttons
  const frag = document.createDocumentFragment();
  let firstUrl = null;

  user.pages.forEach((p, i) => {
    const url = PAGES[p];
    if (!url) return;
    
    const btn = document.createElement('button');
    btn.textContent = PAGE_NAMES[p] || `Page ${p}`;
    btn.onclick = () => load(url, btn);
    
    if (i === 0) {
      btn.className = 'active';
      firstUrl = url;
    }
    
    frag.appendChild(btn);
  });

  menu.appendChild(frag);

  // Load first page
  if (firstUrl) {
    setTimeout(() => frame.src = firstUrl, 100);
  }

  // Open native
  openBtn.onclick = () => {
    const url = frame.src.replace('/embed/reporting', '/reporting');
    window.open(url, '_blank', 'noopener');
  };

  // Mobile sidebar toggle
  toggle.onclick = () => {
    sidebar.classList.add('open');
    overlay.classList.add('show');
  };

  overlay.onclick = () => {
    sidebar.classList.remove('open');
    overlay.classList.remove('show');
  };

  // Keyboard shortcuts
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && sidebar.classList.contains('open')) {
      sidebar.classList.remove('open');
      overlay.classList.remove('show');
    }
  });
}

// ============ LOAD PAGE ============
let currentBtn = null;
function load(url, btn) {
  if (!url || !url.startsWith('https://lookerstudio.google.com/embed/')) return;
  
  const frame = document.getElementById('frame');
  const sidebar = document.getElementById('sidebar');
  const overlay = document.getElementById('overlay');
  
  // Update active button
  if (currentBtn) currentBtn.classList.remove('active');
  btn.classList.add('active');
  currentBtn = btn;
  
  // Load iframe
  frame.src = url;
  
  // Close mobile sidebar
  sidebar.classList.remove('open');
  overlay.classList.remove('show');
}

// ============ ERROR ============
function deny(msg) {
  document.getElementById('loading').innerHTML = 
    `<div class="error"><h3>Access Denied</h3><p>${msg}</p></div>`;
}

// ============ SERVICE WORKER (optional) ============
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('/sw.js').catch(() => {});
}
</script>
</body>
</html>
