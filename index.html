<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>CHAVAN HERO</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#1a1d29;
  --panel:#252936;
  --accent:#667eea;
  --text:#fff;
  --muted:#b8c1ec;
  font-family:Inter,system-ui,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text)}

.login{
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
}
.login-box{
  background:var(--panel);
  padding:40px;
  border-radius:16px;
  width:350px;
  text-align:center;
}
.login-box input{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:none;
  margin-bottom:16px;
}
.login-box button{
  width:100%;
  padding:12px;
  border-radius:8px;
  border:none;
  background:linear-gradient(135deg,#667eea,#764ba2);
  color:#fff;
  cursor:pointer;
}
.error{color:#ff6b6b;margin-top:10px;font-size:14px}

.app{display:none;height:100vh;flex-direction:column}
header{display:flex;align-items:center;padding:12px 16px;background:linear-gradient(135deg,#667eea,#764ba2)}
.logo{width:36px;height:36px;background:rgba(255,255,255,.25);border-radius:10px;overflow:hidden}
.logo img{width:100%;height:100%;object-fit:cover}
.title{margin-left:12px;font-size:16px;font-weight:600}
.spacer{flex:1}
.header-btn{margin-left:8px;padding:8px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.25);background:rgba(255,255,255,.15);color:#fff;cursor:pointer;font-size:13px}
main{flex:1;display:flex;overflow:hidden}
.sidebar{width:240px;background:var(--panel);padding:12px}
.menu button{width:100%;margin-bottom:6px;padding:10px;border:none;border-radius:8px;background:none;color:var(--muted);text-align:left;cursor:pointer}
.menu button.active{background:linear-gradient(135deg,#667eea,#764ba2);color:#fff}
.viewer{flex:1;padding:12px}
.iframe-wrap{width:100%;height:100%;background:#fff;border-radius:12px;overflow:hidden}
iframe{width:100%;height:100%;border:0}
</style>
</head>

<body>

<div class="login" id="loginPage">
  <div class="login-box">
    <h2>CHAVAN HERO</h2>
    <input type="password" id="accessCode" placeholder="Enter Access Code">
    <button id="loginBtn">Login</button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<div class="app" id="app">
<header>
  <div class="logo">
    <img src="https://raw.githubusercontent.com/chavanheromis-collab/Looker_Desktop/main/c.png">
  </div>
  <div class="title">CHAVAN HERO</div>
  <div class="spacer"></div>
  <button class="header-btn" id="logoutBtn">Logout</button>
</header>

<main>
  <aside class="sidebar">
    <div class="menu" id="menu"></div>
  </aside>
  <div class="viewer">
    <div class="iframe-wrap">
      <iframe id="frame"></iframe>
    </div>
  </div>
</main>
</div>

<script>
'use strict';

const API = "https://script.google.com/macros/s/AKfycbznU_3SWKemZRGHLaf0Yunuk1WHQYS-ncthLPNGg3thBhkyDbLijl0IYnY2RAmvVado/exec";

const PAGES = {
  2:'https://lookerstudio.google.com/embed/reporting/fd60b965-c7e7-407c-bae0-71de42f0c6e4/page/p_m59n1wrr0d?params=%7B%22df128%22:%22include%25EE%2580%25800%25EE%2580%2580IN%25EE%2580%2580Vaishnavi%2520Durgam%22%7D'
};

const PAGE_NAMES = {
  2:'B2D OVERVIEW'
};

let currentDSE = "";
let currentRole = "";

/* LOGIN */
document.getElementById('loginBtn').onclick = async () => {

  const code = document.getElementById('accessCode').value.trim();
  const errorBox = document.getElementById('loginError');

  if(!code){
    errorBox.textContent = "Please enter access code";
    return;
  }

  try{
    const res = await fetch(`${API}?code=${encodeURIComponent(code)}`);
    const data = await res.json();

    if(!data.authorized){
      errorBox.textContent = "Invalid or disabled access";
      return;
    }

    currentDSE = data.dse.trim();
    currentRole = data.role;

    document.getElementById('loginPage').style.display = "none";
    document.getElementById('app').style.display = "flex";

    initDashboard();

  }catch(err){
    errorBox.textContent = "Server error";
  }
};

/* DASHBOARD */
function initDashboard(){

  document.querySelector('.title').innerHTML += ` - ${currentDSE}`;

  const menu = document.getElementById('menu');
  const frame = document.getElementById('frame');

  const btn=document.createElement('button');
  btn.textContent="B2D OVERVIEW";

  btn.onclick=()=>{

    let url = PAGES[2];

    if (currentRole === "DSE") {

        const nameEncoded = encodeURIComponent(currentDSE);
    
        const filterPart =
          "include%EE%80%25800%EE%80%2580IN%EE%80%2580" + nameEncoded;
    
        const finalParams =
          "%7B%22df128%22:%22" + filterPart + "%22%7D";
    
        url += "?params=" + finalParams;
    }


    frame.src = url;
  };

  menu.appendChild(btn);
  btn.click();
}

/* LOGOUT */
document.getElementById('logoutBtn').onclick = () => {
  location.reload();
};
</script>

</body>
</html>
